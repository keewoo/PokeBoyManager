services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pbm}
      POSTGRES_DB: ${POSTGRES_DB:-pbm}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pbm_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pbm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - pbm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3 de dev : SeaweedFS, épinglé — MinIO n'est plus distribué en image depuis le
  # 01/10/2026. Mêmes identifiants que l'API (S3_ACCESS_KEY / S3_SECRET_KEY de .env), donc
  # rien à aligner à la main. Voir docs/CODE.md § « Stockage S3 de dev/CI ».
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-pbm}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-pbmpbmpbm}
    ports:
      - "${S3_API_PORT:-59000}:8333"
    volumes:
      - pbm_s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-51025}:1025"
      - "${MAILPIT_UI_PORT:-58025}:8025"

volumes:
  pbm_postgres_data:
  pbm_redis_data:
  pbm_s3_data:
