name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pbm/web lint
      - run: pnpm --filter @pbm/web type-check
      - run: pnpm --filter @pbm/web test
      - run: pnpm --filter @pbm/web build

      # Non bloquant pour l'instant (mission `v5-securite` point 2) : au 20/09/2026, les seules
      # failles connues (`pnpm audit`) sont dans des devDependencies de build (vite/vitest/
      # postcss/esbuild), jamais expédiées dans le bundle de production — voir docs/SECURITE.md
      # pour le détail et le suivi. Toujours exécuté et visible dans le journal : une régression
      # (nouvelle faille, ou une de ces quatre qui gagnerait la sévérité `critical` en
      # production) doit se voir ici avant de devenir bloquante.
      - name: pnpm audit (dépendances JS)
        run: pnpm --filter @pbm/web audit
        continue-on-error: true

  api:
    name: api — lint, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbm
          POSTGRES_PASSWORD: pbm
          POSTGRES_DB: pbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_test
      TEST_DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pbm
      S3_SECRET_KEY: pbmpbmpbm
      S3_BUCKET: pbm-v2-catalogue-ci
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MinIO n'a pas de commande par défaut compatible avec le bloc `services:` de GitHub
      # Actions (pas d'option pour surcharger la commande) : démarré comme un conteneur
      # ordinaire, comme dans docker-compose.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pbm -e MINIO_ROOT_PASSWORD=pbmpbmpbm \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO n'a jamais répondu" >&2
          exit 1

      - working-directory: apps/api
        run: uv sync --locked

      - working-directory: apps/api
        run: uv run ruff check .

      # Bloquant (contrairement à `pnpm audit` ci-dessus) : aucune faille connue au 20/09/2026
      # (mission `v5-securite` point 2, voir docs/SECURITE.md) — une régression ici doit
      # empêcher le merge, pas seulement s'afficher.
      - name: pip-audit (dépendances Python)
        working-directory: apps/api
        run: |
          uv export --no-hashes --no-header -o /tmp/requirements.txt
          grep -v '^-e ' /tmp/requirements.txt > /tmp/requirements-clean.txt
          # `--no-deps` : auditer exactement les versions épinglées par `uv export` (toutes
          # transitives comprises) SANS relancer une résolution pip. `pyproject.toml` déclare
          # `override-dependencies = ["redis>=8.1.0"]` (arq 0.28.0 épingle encore `redis<6`, mais
          # son client `redis.asyncio` fonctionne avec redis-py 8.1.0) : uv honore l'override, le
          # résolveur pip de pip-audit ne le comprend pas et échoue en `ResolutionImpossible`. Le
          # jeu audité reste identique (mêmes pins), seule l'étape de re-résolution est évitée.
          uvx pip-audit --no-deps -r /tmp/requirements-clean.txt

      - working-directory: apps/api
        run: uv run alembic upgrade head

      - working-directory: apps/api
        run: uv run pytest -q

  e2e:
    name: e2e — parcours auth (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbm
          POSTGRES_PASSWORD: pbm
          POSTGRES_DB: pbm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_e2e
      # `alembic upgrade head` (étape dédiée ci-dessous) lit `DATABASE_URL`, pas
      # `E2E_DATABASE_URL` (seuls les webServers de playwright.config.ts mappent le second sur le
      # premier). Sans cette ligne, alembic retombe sur le défaut de `pbm_api.config` (port 55432)
      # et échoue en `Connect call failed`. Même base que `E2E_DATABASE_URL` : le service Postgres
      # du job écoute sur 5432.
      DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_e2e
      REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_UI_PORT: "8025"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pbm
      S3_SECRET_KEY: pbmpbmpbm
      S3_BUCKET: pbm-e2e
    steps:
      - uses: actions/checkout@v4

      # MinIO n'a pas de commande par défaut compatible avec le bloc `services:` de GitHub
      # Actions (pas d'option pour surcharger la commande) : démarré comme un conteneur
      # ordinaire, comme dans le job `api` ci-dessus. Nécessaire depuis que des specs e2e
      # au-delà du parcours auth (validation, fiche carte) sèment des photos en stockage objet
      # (`pbm_api.storage.build_storage`) — sans lui, le script de semis échoue
      # (`EndpointConnectionError`) avant même que le navigateur ouvre une page.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pbm -e MINIO_ROOT_PASSWORD=pbmpbmpbm \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO n'a jamais répondu" >&2
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - working-directory: apps/api
        run: uv sync --locked

      - working-directory: apps/api
        run: uv run alembic upgrade head

      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - working-directory: apps/web
        run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
