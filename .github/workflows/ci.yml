name: CI

on:
  # `roadmap/**` : la CI tourne sur la branche du lot des qu'il pousse, sans PR et
  # sans approbation. C'etait le maillon manquant — une PR ouverte par le bot met son
  # execution en « action_required », donc en attente d'un clic, donc rien n'est verifie.
  # Une poussee par un humain, elle, declenche la CI normalement. Un lot a desormais son
  # verdict quoi qu'il arrive a sa PR.
  push:
    branches: [main, 'roadmap/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pbm/web lint
      - run: pnpm --filter @pbm/web type-check
      - run: pnpm --filter @pbm/web test
      - run: pnpm --filter @pbm/web build

      # Garde (mission `pbm-front-accueil`) : cette étape ne définit délibérément pas
      # `NEXT_PUBLIC_API_URL` — reproduit exactement la configuration incomplète trouvée en PROD
      # (JF, capture d'écran du 20/09/2026) où le JavaScript servi contenait encore
      # "http://localhost:8000" en dur (`src/lib/config.ts`, avant correctif). `.next/static` est
      # ce qui part réellement vers le navigateur ; `.next/server` peut légitimement mentionner
      # des chemins locaux (sourcemaps) sans rapport avec ce risque.
      - name: Garde — aucune URL localhost dans le JavaScript de production
        run: |
          # Motif CIBLÉ : une URL/origine localhost (`http://localhost:8000`, `//localhost`,
          # `localhost:<port>`) — exactement le défaut trouvé en PROD (JF, capture du 20/09/2026),
          # un repli en dur de `src/lib/config.ts`. Pas le mot nu "localhost" : le polyfill URL de
          # Next (`"localhost"===host`, token de la spec WHATWG URL) le contient dans TOUT build et
          # n'est jamais une adresse d'API — une garde sur le mot nu serait un faux positif
          # ininterprétable. `.next/static` est ce qui part réellement vers le navigateur.
          if grep -rlaE 'localhost:[0-9]|//localhost' apps/web/.next/static; then
            echo "::error::URL localhost trouvée dans apps/web/.next/static — src/lib/config.ts doit se replier sur une origine relative (/api), jamais un hôte en dur" >&2
            exit 1
          fi
          echo "Aucune URL localhost dans apps/web/.next/static."

      # Non bloquant pour l'instant (mission `v5-securite` point 2) : au 20/09/2026, les seules
      # failles connues (`pnpm audit`) sont dans des devDependencies de build (vite/vitest/
      # postcss/esbuild), jamais expédiées dans le bundle de production — voir docs/SECURITE.md
      # pour le détail et le suivi. Toujours exécuté et visible dans le journal : une régression
      # (nouvelle faille, ou une de ces quatre qui gagnerait la sévérité `critical` en
      # production) doit se voir ici avant de devenir bloquante.
      - name: pnpm audit (dépendances JS)
        run: pnpm --filter @pbm/web audit
        continue-on-error: true

  api:
    name: api — lint, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbm
          POSTGRES_PASSWORD: pbm
          POSTGRES_DB: pbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_test
      TEST_DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pbm
      S3_SECRET_KEY: pbmpbmpbm
      S3_BUCKET: pbm-v2-catalogue-ci
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MinIO n'a pas de commande par défaut compatible avec le bloc `services:` de GitHub
      # Actions (pas d'option pour surcharger la commande) : démarré comme un conteneur
      # ordinaire, comme dans docker-compose.yml.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pbm -e MINIO_ROOT_PASSWORD=pbmpbmpbm \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO n'a jamais répondu" >&2
          exit 1

      - working-directory: apps/api
        run: uv sync --locked

      - working-directory: apps/api
        run: uv run ruff check .

      # Bloquant (contrairement à `pnpm audit` ci-dessus) : aucune faille connue au 20/09/2026
      # (mission `v5-securite` point 2, voir docs/SECURITE.md) — une régression ici doit
      # empêcher le merge, pas seulement s'afficher.
      - name: pip-audit (dépendances Python)
        working-directory: apps/api
        # Audite l'environnement DÉJÀ installé par `uv sync --locked` ci-dessus — exactement le
        # jeu de paquets qui part en PROD — plutôt qu'un fichier `requirements` réaudité par pip.
        # `pyproject.toml` déclare `override-dependencies = ["redis>=8.1.0"]` (arq 0.28.0 épingle
        # encore `redis<6`, mais son client `redis.asyncio` marche avec redis-py 8.1.0) : uv
        # honore l'override, mais le mode `-r` de pip-audit relance une résolution pip (même avec
        # `--no-deps`, un `pip install --dry-run` est fait) qui rejette l'override en
        # `ResolutionImpossible`. Auditer l'environnement synchronisé évite toute re-résolution.
        # `--skip-editable` saute le paquet local `pbm-api` (éditable, absent de PyPI).
        run: uv run --with pip-audit pip-audit --skip-editable

      - working-directory: apps/api
        run: uv run alembic upgrade head

      - working-directory: apps/api
        run: uv run pytest -q

  e2e:
    name: e2e — parcours auth (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbm
          POSTGRES_PASSWORD: pbm
          POSTGRES_DB: pbm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_e2e
      # `alembic upgrade head` (étape dédiée ci-dessous) lit `DATABASE_URL`, pas
      # `E2E_DATABASE_URL` (seuls les webServers de playwright.config.ts mappent le second sur le
      # premier). Sans cette ligne, alembic retombe sur le défaut de `pbm_api.config` (port 55432)
      # et échoue en `Connect call failed`. Même base que `E2E_DATABASE_URL` : le service Postgres
      # du job écoute sur 5432.
      DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_e2e
      REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_UI_PORT: "8025"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: pbm
      S3_SECRET_KEY: pbmpbmpbm
      S3_BUCKET: pbm-e2e
    steps:
      - uses: actions/checkout@v4

      # MinIO n'a pas de commande par défaut compatible avec le bloc `services:` de GitHub
      # Actions (pas d'option pour surcharger la commande) : démarré comme un conteneur
      # ordinaire, comme dans le job `api` ci-dessus. Nécessaire depuis que des specs e2e
      # au-delà du parcours auth (validation, fiche carte) sèment des photos en stockage objet
      # (`pbm_api.storage.build_storage`) — sans lui, le script de semis échoue
      # (`EndpointConnectionError`) avant même que le navigateur ouvre une page.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pbm -e MINIO_ROOT_PASSWORD=pbmpbmpbm \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO n'a jamais répondu" >&2
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - working-directory: apps/api
        run: uv sync --locked

      - working-directory: apps/api
        run: uv run alembic upgrade head

      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - working-directory: apps/web
        run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
