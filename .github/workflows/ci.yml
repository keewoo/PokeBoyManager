name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pbm/web lint
      - run: pnpm --filter @pbm/web type-check
      - run: pnpm --filter @pbm/web test
      - run: pnpm --filter @pbm/web build

  api:
    name: api — lint, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbm
          POSTGRES_PASSWORD: pbm
          POSTGRES_DB: pbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pbm:pbm@localhost:5432/pbm_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.13"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - working-directory: apps/api
        run: uv sync --locked

      - working-directory: apps/api
        run: uv run ruff check .

      - working-directory: apps/api
        run: uv run pytest -q
