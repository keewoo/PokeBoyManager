name: PR automatique des lots

# Aucun jeton de la flotte ne peut ouvrir une PR (ils n'ont pas `pull_requests=write`,
# GitHub le dit lui-meme dans l'en-tete x-accepted-github-permissions). Le jeton d'un
# runner, lui, est fourni par GitHub : il suffit de le demander ci-dessous.
# Sans PR, le workflow de CI ne tourne pas sur la branche du lot — et c'est la CI qui fait foi.
on:
  push:
    branches: ['roadmap/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  ouvrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ouvrir la PR si elle n'existe pas
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(gh pr list --head "$BRANCHE" --json number --jq 'length')" != "0" ]; then
            echo "PR deja ouverte pour $BRANCHE"; exit 0
          fi
          if git merge-base --is-ancestor "origin/$BRANCHE" origin/main; then
            echo "Branche deja fusionnee dans main — rien a ouvrir"; exit 0
          fi
          gh pr create --base main --head "$BRANCHE" --fill
