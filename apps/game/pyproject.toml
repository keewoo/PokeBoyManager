[project]
name = "pbm-game"
version = "0.1.0"
description = "Moteur de jeu PokeBoyManager — règles pures, sans HTTP ni base"
requires-python = ">=3.12,<3.13"
# Le moteur est PUR : aucune dépendance d'exécution. Toute dépendance ajoutée ici
# doit être justifiée — le moteur ne connaît ni HTTP, ni base, ni réseau.
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    # pyyaml : uniquement pour TESTER la table de cas (docs/jeu/cas-de-regles.yaml).
    # Ce n'est pas une dépendance du moteur lui-même.
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbm_game"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
