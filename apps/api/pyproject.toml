[project]
name = "pbm-api"
version = "0.1.0"
description = "API PokeBoyManager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "argon2-cffi>=25.1.0",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "email-validator>=2.3.0",
    "arq>=0.26.3",
    "boto3>=1.35.0",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.uv]
# arq 0.28.0 (dernière version publiée) épingle encore `redis<6` ; v1-auth dépend de
# redis-py 8.1.0. Le client `redis.asyncio` qu'arq utilise (Redis, BlockingConnectionPool)
# n'a pas changé de forme entre les deux — vérifié en conditions réelles (job arq enqueue +
# burst contre un Redis 7 réel, voir compte rendu v2-catalogue) : la contrainte amont est
# obsolète, pas un vrai conflit d'API.
override-dependencies = ["redis>=8.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbm_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI impose `Depends(...)` comme valeur par défaut d'argument : appel volontaire,
# pas le piège habituel d'objet mutable partagé entre appels que B008 détecte.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
