  - id: degats-resistance-moins-30
    regles: [R-10.3, R-10.1]
    categorie: degats
    description: "La résistance réduit les dégâts de 30 à l'étape 4 de l'ordre officiel."
  - id: degats-ordre-faiblesse-puis-resistance
    regles: [R-10.1, R-10.8]
    categorie: degats
    description: "Faiblesse PUIS résistance ; l'ordre des opérations est respecté (bi-type inclus)."
  - id: degats-compteurs-pas-pv
    regles: [R-10.4]
    categorie: degats
    description: "Les dégâts se posent en compteurs, jamais en soustrayant des PV."
  - id: degats-banc-sans-faiblesse-resistance
    regles: [R-10.5]
    categorie: degats
    description: "Les dégâts au banc n'appliquent ni faiblesse ni résistance."
  - id: degats-plancher-zero
    regles: [R-10.7]
    categorie: cas-limite
    cas_limite: resistance-superieure-aux-degats
    description: "Résistance supérieure aux dégâts : plancher à 0, aucun compteur."
  - id: degats-faiblesse-sur-zero
    regles: [R-10.1]
    categorie: cas-limite
    cas_limite: faiblesse-sur-degats-nuls
    description: "Attaque de 0 dégât : l'attaque s'arrête à l'étape 2, la faiblesse n'est jamais appliquée."
  - id: degats-detail-journalise
    regles: [R-10.9]
    categorie: degats
    description: "Le détail de calcul est produit et journalisé pour chaque attaque."

