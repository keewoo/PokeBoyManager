# cas-de-regles.yaml — table de cas de test du moteur de jeu
#
# GÉNÉRÉ PAR AUCUN SCRIPT — édité à la main avec REGLES.md, son unique source.
# Chaque cas NOMME la ou les règles `R-x.y` qu'il vérifie (champ `regles`). Le test
# apps/game/tests/test_corpus_regles.py garantit que :
#   - chaque `regles` cite un identifiant qui EXISTE dans docs/jeu/REGLES.md ;
#   - chaque cas cite au moins une règle ;
#   - les dix cas limites de la mission j-regles-reference sont couverts (champ `cas_limite`).
#
# Cette table reste **documentaire** : elle NOMME, pour chaque règle, un cas qui la vérifie, sans
# état d'entrée ni résultat attendu. Les cas **exécutables** (état de départ, action, résultat
# attendu, rejoués contre le moteur) vivent à part, dans `docs/jeu/cas-executables/*.yaml` — lot
# j-tests-regles ; leur format est documenté dans `docs/jeu/CAS-EXECUTABLES.md`. La garde de
# couverture (apps/game/tests/test_couverture_regles.py) traite les deux ensembles : une règle du
# corpus sans aucun cas (ici OU exécutable) ni exception justifiée fait échouer la CI.
#
# Schéma d'un cas :
#   id          : identifiant unique kebab-case
#   regles      : liste d'au moins un R-x.y défini dans REGLES.md
#   categorie   : famille (setup, tour, premier-tour, degats, etats, checkup, ko, victoire,
#                 mouvement, cartes, cas-limite)
#   description : ce que le cas vérifie, en une phrase
#   cas_limite  : (facultatif) slug canonique quand le cas couvre un des dix cas limites

version: 1

cas:
  # --- Mise en place et mulligan ---
  - id: setup-six-recompenses
    regles: [R-3.4, R-4.3]
    categorie: setup
    description: "La mise en place pose exactement 6 récompenses face cachée par joueur."
  - id: setup-banc-max-cinq
    regles: [R-3.2, R-4.2]
    categorie: setup
    description: "On pose au plus 5 Pokémon de base au banc à la mise en place."
  - id: mulligan-sans-base
    regles: [R-4.4]
    categorie: setup
    description: "Une main d'ouverture sans Pokémon de base déclenche un mulligan."
  - id: mulligan-cartes-bonus
    regles: [R-4.5]
    categorie: cas-limite
    cas_limite: mulligan-multiple
    description: "L'adversaire pioche une carte par mulligan supplémentaire pris par l'autre joueur."

  # --- Déroulé d'un tour ---
  - id: tour-une-energie
    regles: [R-5.4]
    categorie: tour
    description: "On ne peut attacher qu'une seule énergie par tour (2e tentative refusée, R-5.4)."
  - id: tour-un-supporter
    regles: [R-5.5]
    categorie: tour
    description: "On ne peut jouer qu'un seul Supporter par tour."
  - id: tour-une-retraite
    regles: [R-5.6, R-8.3]
    categorie: tour
    description: "On ne peut battre en retraite qu'une seule fois par tour."
  - id: tour-attaque-termine
    regles: [R-5.7]
    categorie: tour
    description: "Déclarer une attaque termine le tour ; plus aucune action ensuite."
  - id: tour-attaque-sans-degat-termine
    regles: [R-5.8]
    categorie: tour
    description: "Une attaque qui n'inflige aucun dégât termine quand même le tour."
  - id: evolution-interdite-tour-de-pose
    regles: [R-7.3]
    categorie: tour
    description: "Un Pokémon ne peut pas évoluer le tour où il est entré en jeu."
  - id: evolution-retire-etats
    regles: [R-7.2, R-11.9]
    categorie: etats
    description: "Faire évoluer un Pokémon retire tous ses états spéciaux."

  # --- Premier tour ---
  - id: premier-tour-pas-attaque
    regles: [R-6.1]
    categorie: premier-tour
