  - id: premier-tour-pioche-et-energie
    regles: [R-6.3, R-6.4]
    categorie: premier-tour
    description: "Le joueur qui commence pioche et peut attacher une énergie à son premier tour."
  - id: premier-tour-pas-evolution
    regles: [R-6.5]
    categorie: premier-tour
    description: "Aucun joueur ne peut faire évoluer à son premier tour."

