  - id: deck-un-ace-spec
    regles: [R-2.3, R-15.10]
    categorie: setup
    description: "Au plus une carte ACE SPEC par deck."
  - id: deck-un-radiant
    regles: [R-2.4, R-15.9]
    categorie: setup
    description: "Au plus un Pokémon Radiant par deck."
  - id: deck-carte-non-scriptee-refusee
    regles: [R-2.6, R-15.12]
    categorie: setup
    description: "Une carte dont l'effet n'est pas scripté et testé est refusée au deck (D9)."
